<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MP4 → animated WebP</title>
<style>
:root{color-scheme:dark;--bg:#0d0d12;--card:#17171f;--card2:#20202a;--txt:#f6f4ff;--muted:#aaa6ba;--accent:#d7b7ff;--line:#343340}
*{box-sizing:border-box}body{margin:0;background:#0d0d12;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{width:min(880px,calc(100% - 28px));margin:36px auto}.pill{display:inline-block;padding:6px 9px;border-radius:999px;background:#2c2138;color:#e6d4ff;font-size:12px}
h1{margin:10px 0 6px}.muted{color:var(--muted)}.card{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.drop{display:block;width:100%;border:1.5px dashed #554b63;border-radius:16px;padding:28px;text-align:center;cursor:pointer;background:#121219}.drop input{display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;clear:both}@media(max-width:680px){.grid{grid-template-columns:1fr}}
.box{background:#121219;border:1px solid #2f2f39;border-radius:14px;padding:13px}.label{font-size:13px;color:var(--muted);margin-bottom:7px}
select{width:100%;background:#20202a;color:#fff;border:1px solid #393846;border-radius:10px;padding:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.help{font-size:12px;color:#888495;margin-top:7px;line-height:1.45}.toggle{display:flex;align-items:center;gap:8px}.toggle input{width:17px;height:17px}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}button,a.download{border:0;border-radius:12px;padding:12px 15px;font-weight:750;text-decoration:none}
button{cursor:pointer}.primary{background:#d9bcff;color:#1b1125;flex:1}.secondary{background:#292833;color:#eee;border:1px solid #3a3946}
.status{margin-top:14px;padding:12px;background:#101016;border:1px solid #2d2c35;border-radius:12px;display:none}.status.show{display:block}.log{font:11px/1.45 monospace;color:#8a8694;white-space:pre-wrap;max-height:110px;overflow:auto;margin-top:8px}
.downloads{display:flex;flex-direction:column;gap:8px;margin-top:12px}.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 11px;background:#20202a;border-radius:10px}.download{background:#b8efcc;color:#102419}
.preview{display:none;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.preview.show{display:grid}@media(max-width:680px){.preview.show{grid-template-columns:1fr}}video,img{max-width:100%;display:block}
.overlay{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:10}.overlay.show{display:flex}.spinner{width:44px;height:44px;border-radius:50%;border:4px solid #ffffff33;border-top-color:#fff;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main class="wrap">
  <div class="pill">v17.1 · 로컬 처리 · 서버 업로드 없음</div>
  <h1>MP4 → animated WebP</h1>
  <div class="muted">화질·해상도·FPS를 선택해 브라우저에서 바로 변환합니다.</div>
  <section class="card">
    <label class="drop" id="drop">
      <input id="fileInput" type="file" accept="video/mp4,.mp4" multiple>
      <b>MP4 파일을 클릭하거나 끌어놓기</b>
      <div class="muted" id="picked" style="margin-top:7px">여러 개 선택 가능</div>
    </label>

    <div class="grid">
      <div class="box"><div class="label">화질</div><select id="quality"><option value="90">Q90</option><option value="85" selected>Q85 · 기본값</option><option value="80">Q80</option><option value="75">Q75</option></select></div>
      <div class="box"><div class="label">해상도</div><select id="scale"><option value="original">원본</option><option value="1920">긴 변 1920</option><option value="1280" selected>긴 변 1280 · 기본값</option><option value="960">긴 변 960</option></select></div>
      <div class="box"><div class="label">FPS</div><select id="fps"><option value="original" selected>원본 그대로</option><option value="60">60</option><option value="30">30</option><option value="24">24</option><option value="15">15</option></select></div>
      <div class="box">
        <div class="label">재생</div>
        <div class="row"><label class="toggle"><input id="loop" type="checkbox" checked> 무한 반복</label></div>
        <div class="help">animated WebP 자체에 반복 정보를 넣습니다.</div>
      </div>
      <div class="box">
        <div class="label">아이폰 최적화</div>
        <div class="row"><label class="toggle"><input id="iphoneOptimize" type="checkbox"> 아이폰 최적화 모드</label><span class="muted" style="font-size:12px">iOS/DC 앱용</span></div>
        <div class="help">선택한 FPS·해상도·화질은 유지하고 WebP 압축 강도만 높입니다.</div>
      </div>
    </div>

    <div class="actions">
      <button class="primary" id="convert" disabled>WebP로 변환</button>
      <button class="secondary" id="reset" type="button">초기화</button>
    </div>
    <div id="downloads" class="downloads"></div>
    <div id="status" class="status"><div id="statusText">준비 중…</div><div id="log" class="log"></div></div>
    <div id="preview" class="preview"><div><div class="muted">원본</div><video id="srcPreview" controls muted playsinline></video></div><div><div class="muted">변환본</div><img id="outPreview"></div></div>
  </section>
</main>
<div id="overlay" class="overlay"><div><div class="spinner"></div><div id="count" style="text-align:center;margin-top:10px">0/0</div></div></div>

<script>
const FFMessageType={LOAD:"LOAD",EXEC:"EXEC",FFPROBE:"FFPROBE",WRITE_FILE:"WRITE_FILE",READ_FILE:"READ_FILE",DELETE_FILE:"DELETE_FILE",ERROR:"ERROR",PROGRESS:"PROGRESS",LOG:"LOG"};
class FFmpegLocal{
 constructor(){this.worker=null;this.seq=0;this.pending=new Map();this.listeners={log:[],progress:[]}}
 on(t,cb){this.listeners[t]?.push(cb)}
 ensure(){if(this.worker)return;this.worker=new Worker(new URL("./ffmpeg-worker.js?v=5",location.href).href,{type:"module"});this.worker.onmessage=({data})=>{const{id,type,data:p}=data||{};if(type===FFMessageType.LOG){this.listeners.log.forEach(fn=>fn(p));return}if(type===FFMessageType.PROGRESS){this.listeners.progress.forEach(fn=>fn(p));return}const q=this.pending.get(id);if(!q)return;this.pending.delete(id);type===FFMessageType.ERROR?q.reject(new Error(String(p))):q.resolve(p)}}
 send(type,data,transfer=[]){this.ensure();const id=++this.seq;return new Promise((resolve,reject)=>{this.pending.set(id,{resolve,reject});this.worker.postMessage({id,type,data},transfer)})}
 load(c={}){return this.send(FFMessageType.LOAD,c)} exec(args,timeout=-1){return this.send(FFMessageType.EXEC,{args,timeout})}
 ffprobe(args,timeout=-1){return this.send(FFMessageType.FFPROBE,{args,timeout})}
 writeFile(path,data){const u8=data instanceof Uint8Array?data:new Uint8Array(data);return this.send(FFMessageType.WRITE_FILE,{path,data:u8},[u8.buffer])}
 readFile(path,encoding="binary"){return this.send(FFMessageType.READ_FILE,{path,encoding})}
 deleteFile(path){return this.send(FFMessageType.DELETE_FILE,{path})}
}
const $=q=>document.querySelector(q);
const input=$("#fileInput"),drop=$("#drop"),picked=$("#picked"),convert=$("#convert"),reset=$("#reset"),downloads=$("#downloads"),status=$("#status"),statusText=$("#statusText"),log=$("#log"),preview=$("#preview"),srcPreview=$("#srcPreview"),outPreview=$("#outPreview"),overlay=$("#overlay"),count=$("#count");
let files=[],ffmpeg=null,loaded=false,srcURL=null,urls=[];
async function blobBytes(b){return new Uint8Array(await b.arrayBuffer())}
async function toBlobURL(url,mime){const r=await fetch(url,{cache:"force-cache"});if(!r.ok)throw new Error("FFmpeg 엔진 다운로드 실패");return URL.createObjectURL(new Blob([await r.arrayBuffer()],{type:mime}))}
async function ensureFFmpeg(){if(loaded)return;ffmpeg=new FFmpegLocal();ffmpeg.on("log",({message})=>{log.textContent=message||""});const base="https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm";const [coreURL,wasmURL]=await Promise.all([toBlobURL(`${base}/ffmpeg-core.js`,"text/javascript"),toBlobURL(`${base}/ffmpeg-core.wasm`,"application/wasm")]);await ffmpeg.load({coreURL,wasmURL});loaded=true}
function choose(list){files=Array.from(list||[]).filter(f=>f.name.toLowerCase().endsWith(".mp4"));if(!files.length)return alert("MP4 파일만 넣어줘!");picked.textContent=files.length===1?files[0].name:`${files.length}개 MP4 선택됨`;convert.disabled=false;if(srcURL)URL.revokeObjectURL(srcURL);srcURL=URL.createObjectURL(files[0]);srcPreview.src=srcURL;preview.classList.add("show");downloads.innerHTML=""}
input.onchange=e=>choose(e.target.files);drop.ondragover=e=>{e.preventDefault()};drop.ondrop=e=>{e.preventDefault();choose(e.dataTransfer.files)}
reset.onclick=()=>{files=[];input.value="";picked.textContent="여러 개 선택 가능";convert.disabled=true;downloads.innerHTML="";status.classList.remove("show");preview.classList.remove("show");urls.forEach(URL.revokeObjectURL);urls=[]}
async function convertOne(file,i){
 const inName=`input_${i}.mp4`,outName=`output_${i}.webp`,probe=`probe_${i}.txt`;
 try{await ffmpeg.deleteFile(inName)}catch{} try{await ffmpeg.deleteFile(outName)}catch{} try{await ffmpeg.deleteFile(probe)}catch{}
 await ffmpeg.writeFile(inName,await blobBytes(file));
 let inputFPS=0;
 try{
   const rc=await ffmpeg.ffprobe(["-v","error","-select_streams","v:0","-show_entries","stream=avg_frame_rate","-of","default=noprint_wrappers=1",inName,"-o",probe]);
   if(rc===0){const s=String(await ffmpeg.readFile(probe,"utf8"));const m=/avg_frame_rate=(\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)/i.exec(s);if(m){const a=+m[1],b=+m[2];if(b>0)inputFPS=a/b}}
 }catch{}
 const fpsChoice=$("#fps").value;
 const targetFPS=fpsChoice!=="original"?Number(fpsChoice):(inputFPS>0?Math.min(60,Math.max(1,inputFPS)):30);
 const filters=["trim=start_frame=1",`fps=${targetFPS}:round=near`,`setpts=N/(${targetFPS}*TB)`];
 const scale=$("#scale").value;
 if(scale!=="original")filters.push(`scale='if(gte(iw,ih),min(iw,${scale}),-2)':'if(gte(iw,ih),-2,min(ih,${scale}))':flags=lanczos`);
 const q=$("#quality").value;
 const compression=$("#iphoneOptimize").checked?"6":"4";
 const args=["-i",inName,"-an","-vf",filters.join(","),"-c:v","libwebp_anim","-lossless","0","-quality",q,"-compression_level",compression,"-cr_threshold","0","-loop",$("#loop").checked?"0":"1",outName];
 const rc=await ffmpeg.exec(args);if(rc!==0)throw new Error(`FFmpeg 종료 코드 ${rc}`);
 const data=await ffmpeg.readFile(outName);const blob=new Blob([data.buffer],{type:"image/webp"});const url=URL.createObjectURL(blob);urls.push(url);
 const item=document.createElement("div");item.className="item";item.innerHTML=`<span>${file.name.replace(/\.mp4$/i,"")}.webp · ${(blob.size/1024/1024).toFixed(1)} MB</span>`;
 const a=document.createElement("a");a.className="download";a.href=url;a.download=file.name.replace(/\.mp4$/i,"")+".webp";a.textContent="다운로드";item.append(a);downloads.append(item);
 if(!outPreview.src)outPreview.src=url;
}
convert.onclick=async()=>{if(!files.length)return;convert.disabled=true;status.classList.add("show");statusText.textContent="변환 중…";overlay.classList.add("show");downloads.innerHTML="";urls.forEach(URL.revokeObjectURL);urls=[];outPreview.removeAttribute("src");
 try{await ensureFFmpeg();for(let i=0;i<files.length;i++){count.textContent=`${i}/${files.length}`;await convertOne(files[i],i);count.textContent=`${i+1}/${files.length}`}statusText.textContent="변환 완료!"}
 catch(e){statusText.textContent="변환 실패";log.textContent=String(e?.stack||e);alert("변환에 실패했어. 오류 로그를 확인해줘.")}
 finally{overlay.classList.remove("show");convert.disabled=!files.length}}
</script>
</body>
</html>
